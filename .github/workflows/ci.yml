# SPDX-License-Identifier: GPL-3.0-only
# Test on Linux and Windows, then build single-file GUI executables for both.
# Pushing a tag "v*" additionally publishes the executables as a GitHub Release.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  build:
    name: build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            exe: dist/esapf-gui.exe
            ext: .exe
          # oldest supported Ubuntu runner: older glibc = runs on more distributions
          - os: ubuntu-22.04
            target: linux-x86_64
            exe: dist/esapf-gui
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --group build
      - run: uv run packaging/build.py
      - name: Self-test the built executable
        # A Qt start-up failure in a windowed .exe shows a modal dialog and would hang.
        timeout-minutes: 3
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # windowed .exe has no console: wait for it and check the exit code
            pwsh -Command '$p = Start-Process -FilePath "${{ matrix.exe }}" -ArgumentList "--self-test" -Wait -PassThru; exit $p.ExitCode'
          else
            "${{ matrix.exe }}" --self-test
          fi
      - name: Name the artefact
        id: name
        shell: bash
        run: |
          version=$(uv run python -c "import esapf; print(esapf.__version__)")
          name="esapf-gui-${version}-${{ matrix.target }}${{ matrix.ext }}"
          mv "${{ matrix.exe }}" "dist/$name"
          echo "file=dist/$name" >> "$GITHUB_OUTPUT"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: esapf-gui-${{ matrix.target }}
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tags with a suffix (v1.2.3-rc1) are published as pre-releases
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" artefacts/* $pre \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
