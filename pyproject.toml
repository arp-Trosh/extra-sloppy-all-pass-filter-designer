[project]
name = "extra-sloppy-apf"
version = "0.1.0.dev0"
description = "Extra Sloppy All Pass Filter Designer: 90° all-pass phase networks for phasing SSB"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyside6>=6.8",
]

[project.scripts]
esapf = "esapf.cli:main"

[project.gui-scripts]
esapf-gui = "esapf.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esapf"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
files = ["src/esapf"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
